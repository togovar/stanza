    <script type="module" src="./gene-cre.js" async></script>

    <script type="module">
      import createHelpApp from './-togostanza/help-app.js';

      const metadata = {"@context":{"stanza":"http://togostanza.org/resource/stanza#"},"@id":"gene-cre","stanza:label":"Gene / CREs","stanza:definition":"Compare the CREs of a gene and its ortholog in the other species: their positions, the orthologous TFs they share, the mouse strains carrying the same variants and the human variants those strains model. Entered from a human or a mouse gene. (data integration of fanta.bio, ChIP-Atlas, NCBI Orthologs, TogoCoord, TogoID/HomoloGene, MoG+ and TogoVar)","stanza:license":"MIT","stanza:author":"moriya_dbcls","stanza:contributor":[],"stanza:created":"2025-09-18","stanza:updated":"2026-09-20","stanza:parameter":[{"stanza:key":"hgnc_id","stanza:type":"string","stanza:example":"404","stanza:description":"HGNC ID of the human gene. Give one of hgnc_id, mgi_id or ncbigene_id. (e.g. 404)","stanza:required":false},{"stanza:key":"mgi_id","stanza:type":"string","stanza:example":"","stanza:description":"MGI ID of the mouse gene; carried to its human ortholog through TogoID (e.g. MGI:99600)","stanza:required":false},{"stanza:key":"ncbigene_id","stanza:type":"string","stanza:example":"","stanza:description":"NCBI Gene ID of a human or mouse gene; the species is decided by whether it has an HGNC ID (e.g. 11669)","stanza:required":false},{"stanza:key":"sparqlist","stanza:type":"string","stanza:example":"https://stg-grch38.togovar.org/sparqlist","stanza:description":"Base URL of the SPARQList that serves gene_cre and gene_cre_mogp","stanza:required":false},{"stanza:key":"togovar","stanza:type":"string","stanza:example":"https://stg-grch38.togovar.org","stanza:description":"TogoVar base URL; togovar_cre_mogplus returns site-relative variant links, which are resolved against it. Set it to an empty string to keep them relative.","stanza:required":false},{"stanza:key":"mogplus_version","stanza:type":"string","stanza:example":"mogplus21","stanza:description":"MoG+ version queried for the variant table (mogplus21, mogplus3)","stanza:required":false},{"stanza:key":"axis","stanza:type":"single-choice","stanza:choice":["genome","gene"],"stanza:example":"genome","stanza:description":"Which way the two genome tracks run. genome: both along the plus strand. gene: each follows its own gene 5' to 3', so a gene pair on opposite strands stops its liftOver ribbons crossing.","stanza:required":false}],"stanza:menu-placement":"bottom-right","stanza:style":[{"stanza:key":"--togostanza-cre-human-color","stanza:type":"color","stanza:default":"#249eb3","stanza:description":"accent color of the human track"},{"stanza:key":"--togostanza-cre-mouse-color","stanza:type":"color","stanza:default":"#ca678d","stanza:description":"accent color of the mouse track"}],"stanza:incomingEvent":[],"stanza:outgoingEvent":[]};
      const readme   = "<h1 id=\"gene--cres\">Gene / CREs</h1>\n<p>Compares the cis-regulatory elements (CREs) of a human gene and its mouse\northolog: where they sit on each genome, which orthologous transcription\nfactors they share, and where each one lifts over in the other species.</p>\n<h2 id=\"data\">Data</h2>\n<table class=\"table\">\n<thead>\n<tr>\n<th>What</th>\n<th>Source</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Everything about the genes and the CREs</td>\n<td>SPARQList <strong><code>gene_cre</code></strong></td>\n</tr>\n<tr>\n<td>Variants in a CRE and the mouse strains carrying them</td>\n<td>SPARQList <strong><code>gene_cre_mogp</code></strong></td>\n</tr>\n</tbody></table>\n<p>Those two are the only APIs the stanza calls. <code>gene_cre</code> resolves the entry\ngene of either species through the NCBI Orthologs endpoint, reads the CREs from\nthe <strong>fanta.bio RDF on RDF Portal</strong> (<code>http://rdfportal.org/dataset/fantabio</code>,\nv1.2.1), and asks <a href=\"https://github.com/moriya-dbcls/togocoord\">TogoCoord</a> for\nevery coordinate: the CRE positions, the human &harr; mouse correspondence, the\nGRCm39 position MoG+ needs, and each gene&#39;s transcription start and strand. The\nstanza used to do the ortholog lookup and all the TogoCoord calls itself; those\nmodules are gone.</p>\n<p>Human results are on GRCh38/hg38 and mouse results on GRCm38/mm10, the assembly\nthe fanta.bio mouse CREs are annotated on. A CRE the TogoCoord fanta store does\nnot hold keeps the position the CRE list gave it, and the legend says how many.</p>\n<h2 id=\"entry-point\">Entry point</h2>\n<p>Either species can be the entry. Give exactly one of:</p>\n<table class=\"table\">\n<thead>\n<tr>\n<th>Key</th>\n<th>Example</th>\n<th>Meaning</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>hgnc_id</code></td>\n<td><code>404</code></td>\n<td>human gene</td>\n</tr>\n<tr>\n<td><code>mgi_id</code></td>\n<td><code>MGI:99600</code></td>\n<td>mouse gene</td>\n</tr>\n<tr>\n<td><code>ncbigene_id</code></td>\n<td><code>217</code> or <code>11669</code></td>\n<td>human or mouse gene</td>\n</tr>\n</tbody></table>\n<p>If more than one is given, only one is used, in the order <code>mgi_id</code>,\n<code>ncbigene_id</code>, <code>hgnc_id</code>. On the demo page <code>hgnc_id</code> is prefilled with <code>404</code>,\nso an <code>mgi_id</code> or <code>ncbigene_id</code> entered there takes precedence over it.</p>\n<p><code>gene_cre</code> takes any of the three and resolves the pair with <strong>one ortholog\nsource</strong>, the NCBI Orthologs RDF endpoint, queried from whichever end was given:</p>\n<pre><code class=\"language-sparql\">{ ncbigene:X orth:hasOrtholog+ ?mouse . BIND(ncbigene:X AS ?human) }\nUNION\n{ ?human orth:hasOrtholog+ ncbigene:X . BIND(ncbigene:X AS ?mouse) }\n</code></pre>\n<p>An earlier version of this stanza resolved a mouse entry itself through TogoID\nand HomoloGene, which meant two ortholog sources in one page — HomoloGene has\nbeen frozen since 2014 — and a mouse gene could in principle come back as a\ndifferent mouse gene. That is gone: the entry and the pair are now decided by\nthe same query.</p>\n<p><strong>The species you came from leads.</strong> It takes the upper track in the diagram,\nits symbol comes first in the heading, and the ranking under the diagram opens\non its own variants:</p>\n<table class=\"table\">\n<thead>\n<tr>\n<th>Entered with</th>\n<th>Upper track</th>\n<th>Ranking opens on</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>hgnc_id</code></td>\n<td>human</td>\n<td>Human variants</td>\n</tr>\n<tr>\n<td><code>mgi_id</code> / mouse <code>ncbigene_id</code></td>\n<td>mouse</td>\n<td>Mouse variants</td>\n</tr>\n</tbody></table>\n<p>The other views are always one click away.</p>\n<h2 id=\"parameters\">Parameters</h2>\n<table class=\"table\">\n<thead>\n<tr>\n<th>Key</th>\n<th>Default</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>hgnc_id</code></td>\n<td></td>\n<td>HGNC ID of the human gene</td>\n</tr>\n<tr>\n<td><code>mgi_id</code></td>\n<td></td>\n<td>MGI ID of the mouse gene</td>\n</tr>\n<tr>\n<td><code>ncbigene_id</code></td>\n<td></td>\n<td>NCBI Gene ID of either species</td>\n</tr>\n<tr>\n<td><code>sparqlist</code></td>\n<td><code>https://sparql-support.dbcls.jp/sparqlist</code></td>\n<td>SPARQList base URL</td>\n</tr>\n<tr>\n<td><code>togovar</code></td>\n<td><code>https://stg-grch38.togovar.org</code></td>\n<td>TogoVar base URL, for the site-relative variant links</td>\n</tr>\n<tr>\n<td><code>mogplus_version</code></td>\n<td><code>mogplus21</code></td>\n<td>MoG+ version queried for the variant table</td>\n</tr>\n<tr>\n<td><code>axis</code></td>\n<td><code>genome</code></td>\n<td><code>genome</code>, or <code>gene</code> to run each track 5&#39; to 3&#39;</td>\n</tr>\n</tbody></table>\n<p>Give one of <code>hgnc_id</code>, <code>mgi_id</code> or <code>ncbigene_id</code>. TogoCoord is reached by the\nSPARQLists, not the stanza, so its URL is set there (<code>togocoord</code>, now\n<code>https://togocoord.dbcls.jp/</code>).</p>\n<h2 id=\"files\">Files</h2>\n<ul>\n<li><code>index.js</code> — fetches the data and wires the stanza together</li>\n<li><code>variants.js</code> — <code>gene_cre_mogp</code> client: every CRE&#39;s ranges in one\nrequest, the rows handed back per CRE and folded into per-variant and\nper-strain tallies</li>\n<li><code>draw.js</code> — the d3 drawing (genome tracks, CRE cards, TF links, liftOver ribbons)</li>\n<li><code>style.scss</code> — styling, following the TogoVar palette and Roboto Condensed</li>\n</ul>\n<h2 id=\"interaction\">Interaction</h2>\n<p><strong>Hover previews, click pins.</strong> Clicking never navigates away; external links\nlive in the details panel as labelled links.</p>\n<ul>\n<li>Hover anything for a short preview, and hover a block on a genome track to\nsee the orthologous region in the other species as a ribbon.</li>\n<li><strong>Click a CRE</strong> (card or genome-track block) to pin it. The panel lists its\nposition, its partner CREs with the number of TFs each shares, and its bound\nTFs with the shared ones accented. The variant table below loads for that CRE.</li>\n<li><strong>Click a connection</strong> to pin the pair. The panel compares the two TF sets in\nthree columns: human only / shared / mouse only.</li>\n<li><strong>Click a TF chip</strong> to highlight every connection that shares it; the CREs\nthat bind it get a dot. Click it again, or &quot;clear&quot;, to drop the highlight.</li>\n<li>Everything the pinned item does not concern is dimmed. Clicking the empty\nbackground, or &quot;Clear&quot;, unpins.</li>\n<li><strong>Click a mouse strain</strong> in the ranking to see every variant it matches,\ngrouped by CRE, with links to TogoVar, dbSNP and MoG+.</li>\n<li><strong>Click a human variant</strong> in the ranking to see its mouse allele, the strains\ncarrying the same substitution, and the CREs it sits in. Clicking one of those\nstrains follows it the other way, so you can walk variant → strain → variant.</li>\n<li><strong>Click a mouse variant</strong> to see the human alleles at the corresponding\nposition, which strains carry it, and the CREs it sits in.</li>\n<li>A dashed block on a genome track is a CRE with no orthologous position.</li>\n</ul>\n<h2 id=\"which-side-you-land-on\">Which side you land on</h2>\n<p>Three readings of the same joined rows, switched with the tabs in the panel\nheader. The tab order is fixed; only which one opens depends on the input.</p>\n<table class=\"table\">\n<thead>\n<tr>\n<th>Tab</th>\n<th>Rows</th>\n<th>Ranked by</th>\n<th>Answers</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Human variants</strong></td>\n<td>human alleles (GRCh38)</td>\n<td>strains carrying the same substitution</td>\n<td>which of my gene&#39;s variants have a mouse model</td>\n</tr>\n<tr>\n<td><strong>Mouse variants</strong></td>\n<td>mouse alleles (GRCm39)</td>\n<td>strains carrying them</td>\n<td>what varies in mouse here, and does it match a human variant</td>\n</tr>\n<tr>\n<td><strong>Mouse strains</strong></td>\n<td>strains</td>\n<td>variants they match</td>\n<td>which animal to order</td>\n</tr>\n</tbody></table>\n<p>The bar in each row is a real fraction of a stated whole, not a share of the\ntop row, so a full bar means &quot;all of them&quot; and the label prints both numbers:</p>\n<table class=\"table\">\n<thead>\n<tr>\n<th>Tab</th>\n<th>Bar</th>\n<th>Whole</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Human variants</td>\n<td>strains carrying the <strong>identical substitution</strong></td>\n<td>strains that vary anywhere in these CREs</td>\n</tr>\n<tr>\n<td>Mouse variants</td>\n<td>strains <strong>carrying the mouse allele</strong>, match or not</td>\n<td>the same</td>\n</tr>\n<tr>\n<td>Mouse strains</td>\n<td>variants the strain matches <strong>identically</strong></td>\n<td>variants here that any strain matches</td>\n</tr>\n</tbody></table>\n<p>Two of the three count exact matches; the Mouse variants row counts carriers of\nthe mouse allele whatever the human side says, and the <strong>human match</strong> badge is\nwhat tells you the two sides agree. Because the match is a property of the\nallele pair rather than of a strain, the carriers of a badged mouse allele are\nexactly the strains that share the human substitution.</p>\n<p><code>alt_match: Yes</code> was checked against 67 rows from four CREs: in all 22 matching\nrows the mouse REF <em>and</em> ALT complement the human REF and ALT on the minus\nstrand, and in all 45 non-matching rows only the ALT differs. So the reference\nbase is shared at every position the API returns, and <code>alt_match</code> is the only\nthing that separates &quot;same substitution&quot; from &quot;both vary, differently&quot;.</p>\n<p>The denominators come from the returned rows, not from the size of the MoG+\npanel, which the API does not report: a strain only appears in a row when it\ncarries the ALT, so &quot;strains that vary anywhere in these CREs&quot; is the widest\nwhole the data supports.</p>\n<p>A mouse variant carries every human allele it was compared against, with the\nexact-substitution one in bold, so the <code>alt_match</code> judgement is visible rather\nthan assumed. Clicking a strain from a variant, or a variant from a strain,\nwalks the join in either direction.</p>\n<h2 id=\"mouse-strains\">Mouse strains</h2>\n<p>Every CRE that lifts over is queried for variants once, in parallel, after the\ndrawing is up (about 60 ms for a gene; the drawing never waits for it). The rows\nare folded back into distinct human variants — the API returns one row per\n(human allele × mouse variant) pair — and then into a per-strain tally.</p>\n<p>A strain is ranked by <strong>how many human variants in these CREs it carries the\nidentical substitution for</strong> (<code>alt_match: Yes</code> in MoG+, i.e. the strain&#39;s ALT\ncorresponds to the human ALT across the liftOver strand).</p>\n<p>Every variant gets a TogoVar link, with or without a TogoVar ID: TogoVar takes\nan allele string on the same route, so <code>/variant/12:111767031-T-C</code> resolves to\nthe search for that allele while <code>/variant/tgv47263876</code> opens a variant report.\nRows without an ID are labelled <code>TogoVar</code> rather than with an ID, and the\n<code>TogoVar ID</code> badge in the ranking still marks the ones that have one.</p>\n<p>Two things the counts do <em>not</em> mean. The API joins TogoVar against MoG+, so it\nonly returns human variants at positions where a mouse strain also varies —\nTogoVar holds far more variants in the same CRE (462 in one 214 bp window where\nthe API returns 14 rows). And <code>tgv_id</code> is empty for most rows, which does not\nmean the variant is unknown: it is in TogoVar&#39;s REST backend with gnomAD\nfrequencies, just not in the smaller annotated subset that carries TogoVar IDs.\nThe panels say &quot;at mouse-variable positions&quot; and &quot;with a TogoVar ID&quot; rather\nthan implying either.</p>\n<p>Strain names arrive under two conventions: RIKEN BRC writes a version suffix\n(<code>MSMv4</code>, <code>JF1v3</code>) and JAX a substrain (<code>PWK/PhJ</code>, <code>JF1/MsJ</code>). The version\nsuffix is stripped, and the two are merged only when one is the versioned form\nof the other&#39;s base name — so <code>JF1v3</code> and <code>JF1/MsJ</code> become one row, while\n<code>C57BL/6NJ</code> and <code>C57BL/10J</code> are never merged. Both original names stay visible\nwith their source and link.</p>\n<h2 id=\"axis-orientation-and-the-tss\">Axis orientation and the TSS</h2>\n<p>Each track carries its gene: a thick segment over the gene&#39;s extent with\nchevrons pointing the way it is read, and a flagged tick at the transcription\nstart. When the gene runs past the drawn window the flag is pinned to the edge\nand says how far off it is (<code>TP53 TSS 9,591 bp off</code>). The gene comes from\nTogoCoord&#39;s annotations over the drawn window, matched on the <code>GeneID:</code> Dbxref\nrather than on the symbol; for mouse the GRCm39 record&#39;s <code>lifted</code> location is\nused, because the CREs are on GRCm38.</p>\n<p>The <strong>Axis</strong> switch above the drawing chooses what the horizontal axis means:</p>\n<table class=\"table\">\n<thead>\n<tr>\n<th>Mode</th>\n<th>Axis</th>\n<th>Use</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>genome</code></td>\n<td>both tracks run along the plus strand</td>\n<td>coordinates read as written</td>\n</tr>\n<tr>\n<td><code>gene</code></td>\n<td>each track follows its own gene 5&#39;→3&#39;</td>\n<td>a gene pair on opposite strands stops crossing</td>\n</tr>\n</tbody></table>\n<p>CRE coordinates are always written on the plus strand, so when the two genes\nface opposite ways every liftOver ribbon crosses over itself. Measured on the\ndrawn polygons: <strong>ALDH2 6 of 6 ribbons twisted in <code>genome</code>, 0 in <code>gene</code>; TP53 13\nof 13 twisted, 0 in <code>gene</code>.</strong> HRAS and CTNNB1 have both genes on the same strand,\nso nothing crosses either way and <code>gene</code> merely reverses both axes together.</p>\n<p>The cards in the correspondence panel follow the same order as the blocks on\ntheir own track, so reversing a track reverses its card row with it. Each row is\nsorted independently by where its CREs land on screen rather than by the order\nthe CRE list returned them, which keeps card and block aligned in both modes and\nfor each species separately — for TP53 (human minus, mouse plus) the human row\nreverses in <code>gene</code> while the mouse row stays put.</p>\n<p>The links between the cards are unaffected: they carry shared TFs, not position,\nso the same pairs stay joined with the same weights and only their endpoints\nmove. They may cross more once a row is reversed, which is the honest picture —\nTF sharing does not follow genomic order.</p>\n<p>A CRE&#39;s name is written on the side of its pill that the links do not leave\nfrom: above for the upper row, below for the lower one. Whichever species is on\ntop gets the labels above, so the entry species decides this too.</p>\n<p>Links that meet at the same card are spread along its edge, each taking room for\nits own stroke, and the fan stays centred on the card (compressed if it would\noverflow). Without this, two thick links running nearly parallel merge into one\nband at 45 % stroke opacity and read as a single much thicker link — and because\nreordering a row changes which links run parallel, the same link appeared to\nchange weight when the axis was switched. It never did; only the overlap did.</p>\n<p>The switch only changes the drawing. Reported strands stay biological: a liftOver\nonto the minus strand still says <code>(minus strand)</code> whatever the axis is doing.\n<code>axis</code> sets which mode the stanza opens in.</p>\n<h2 id=\"how-far-the-correspondence-goes\">How far the correspondence goes</h2>\n<p>There is no single &quot;this human CRE equals that mouse CRE&quot;. Three independent\nlines of evidence are shown, and they routinely disagree:</p>\n<ol>\n<li><strong>Position</strong> — a UCSC chain liftOver. The panel states what fraction of the\nCRE actually aligns, counting aligned bases rather than the outer extent, so\na CRE where only 33 % aligns says so instead of looking like a clean match.\nIt is labelled &quot;coordinates only&quot;.</li>\n<li><strong>Factors</strong> — the shared orthologous TFs, computed upstream and compared\nhere side by side (see the known data issue below).</li>\n<li><strong>Variants</strong> — whether a mouse strain carries the same substitution.</li>\n</ol>\n<p>A CRE pair can align well and share no TF, or share TFs and barely align. The\nstanza shows all three rather than collapsing them into one score.</p>\n<h2 id=\"known-data-issue\">Known data issue</h2>\n<p>When several human CREs pair with the same mouse CRE, <code>togovar_cre</code> returns\n<code>and_tf</code> sets that are <strong>mutually disjoint</strong> — their union is exactly\n<code>mouse_tf_has_orth</code>, so each shared TF is assigned to only one human CRE rather\nthan to every pair that binds it. <code>and</code> and <code>jaccard</code> therefore under-report the\nper-pair overlap (for example FCHS_104206 × FCMM_147216 reports 8 shared TFs\nwhile 13 real TFs are bound on both sides).</p>\n<h3 id=\"fantabio-versions\">fanta.bio versions</h3>\n<p>The CREs used to come from a JSON Lines grep API built on v1.2.0, while\nTogoCoord had ingested v1.2.1, so a handful of CREs the list named were missing\nfrom TogoCoord (<code>FCHS_63347</code> of HRAS, <code>FCHS_166583</code> of TP53). Reading the RDF\nputs both sides on v1.2.1 and that disagreement is gone; those two CREs simply\ndo not exist in v1.2.1. The fallback to the CRE list&#39;s own coordinates, and the\ncount in the legend, are kept for the case where TogoCoord cannot be reached.</p>\n<p>Switching also changed what is shown, because v1.2.1 is newer data: TP53 goes\nfrom 9 to 11 human CREs and from <strong>0 to 20</strong> TF pairs, CTNNB1 from 19 to 22\nhuman CREs. And it is much faster: the RDF answers in about 200 ms per gene\nagainst about 5 s for the grep API, which was roughly 10 s of the API&#39;s total.</p>\n<h3 id=\"cres-without-a-transcription-factor\">CREs without a transcription factor</h3>\n<p>Every CRE of the gene is returned, including those with no ChIP-Atlas antigen.\nThey cannot join a link, so they get <strong>no card</strong>; they appear on the genome\ntracks with a dashed outline and are clickable there for their position,\nliftOver and variants. Keeping them out of the card row matters: mouse Aldh2 has\nnine of them and they sit at the low-coordinate end, so putting them in the row\npushed the four CREs that do pair to the far end and every link became a\ndiagonal across the whole figure.</p>\n<p>The stanza shows <code>and_tf</code> as the API returns it, because <code>jaccard</code> is derived\nfrom it, but marks the TFs that are bound on both sides and missing from the\nshared set with a dashed outline and a note under the comparison. If the\nSPARQList is fixed to intersect per pair, those markers disappear on their own.</p>\n";

      createHelpApp({metadata, readme}).mount('body');
    </script>
  </head>
