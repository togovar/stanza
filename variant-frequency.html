    <script type="module">
      import createHelpApp from './-togostanza/help-app.js';

      const metadata = {"@context":{"stanza":"http://togostanza.org/resource/stanza#"},"@id":"variant-frequency","stanza:label":"Variant / Frequency","stanza:definition":"Display alternate allele frequencies of the variant","stanza:type":"Stanza","stanza:display":"Table","stanza:provider":"TogoVar","stanza:license":"MIT","stanza:author":"Daisuke Satoh","stanza:address":"daisuke.satoh@lifematics.co.jp","stanza:contributor":[],"stanza:created":"2019-04-22","stanza:updated":"2026-08-13","stanza:parameter":[{"stanza:key":"tgv_id","stanza:example":"tgv66359566","stanza:description":"TogoVar ID (required if variant is not given)","stanza:required":false},{"stanza:key":"variant","stanza:example":"1-12345-A-T","stanza:description":"Variant in VCF notation CHROM-POS-REF-ALT (required if tgv_id is not given)","stanza:required":false},{"stanza:key":"assembly","stanza:example":"GRCh38","stanza:description":"assembly: \"GRCh37\" or \"GRCh38\"","stanza:required":true},{"stanza:key":"data-url","stanza:example":"https://stg-grch38.togovar.org","stanza:description":"TogoVar API base URL. A variant search API URL is normalized to its base URL.","stanza:required":true},{"stanza:key":"no_data_message","stanza:example":"No data found.","stanza:description":"Message displayed when there are zero data"},{"stanza:key":"check_local_auth_status","stanza:type":"boolean","stanza:example":true,"stanza:label":"Check auth status on localhost","stanza:description":"When true, auth status is checked even on localhost. Default: false"}],"stanza:about-link-placement":"bottom-right"};
      const readme   = "<h1 id=\"variant--frequency\">Variant / Frequency</h1>\n<p>指定したバリアントのデータセット別アリル頻度を表示する stanza です。</p>\n<h2 id=\"parameters\">Parameters</h2>\n<table class=\"table\">\n<thead>\n<tr>\n<th>Key</th>\n<th>Required</th>\n<th>Example</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>tgv_id</code></td>\n<td>No</td>\n<td><code>tgv66359566</code></td>\n<td>TogoVar ID。<code>variant</code> が無い場合に必要です。</td>\n</tr>\n<tr>\n<td><code>variant</code></td>\n<td>No</td>\n<td><code>1-12345-A-T</code></td>\n<td>VCF表記 <code>CHROM-POS-REF-ALT</code> のバリアント。<code>tgv_id</code> が無い場合に使えます。</td>\n</tr>\n<tr>\n<td><code>assembly</code></td>\n<td>Yes</td>\n<td><code>GRCh38</code></td>\n<td>Assembly。<code>GRCh37</code> または <code>GRCh38</code>。</td>\n</tr>\n<tr>\n<td><code>data-url</code></td>\n<td>Yes</td>\n<td><code>https://stg-grch38.togovar.org</code></td>\n<td>TogoVar API base URL。<code>/api/search/variant</code> endpoint を指定しても base URL へ正規化します。頻度取得は <code>/search</code>、<code>variant</code> から TogoVar ID への解決は <code>/api/search/variant</code> を使います。</td>\n</tr>\n<tr>\n<td><code>no_data_message</code></td>\n<td>No</td>\n<td><code>No data found.</code></td>\n<td>データが無い場合の表示メッセージ。</td>\n</tr>\n<tr>\n<td><code>check_local_auth_status</code></td>\n<td>No</td>\n<td><code>true</code></td>\n<td>localhost でもログイン状態を確認する場合は <code>true</code>。</td>\n</tr>\n</tbody></table>\n<p><code>tgv_id</code> と <code>variant</code> の両方が指定された場合は <code>tgv_id</code> を優先します。\n<code>variant</code> だけが指定された場合は TogoVar variant search API で該当バリアントを探し、TogoVar ID があればそれを <code>/search</code> の <code>term</code> に渡します。TogoVar未登録で TogoVar ID が無い場合でも、dbSNP の <code>rsID</code> が取得できれば <code>rsID</code> を <code>term</code> として頻度情報を取得します。TogoVar ID / rsID のどちらも無い場合は、variant search API の候補レコードに含まれる <code>frequencies</code> を使って表示します。</p>\n";

      createHelpApp({metadata, readme}).mount('body');
    </script>
